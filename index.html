<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول المراقبات النهائية — قسم تقنية الأعمال 1447هـ</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --navy:#0c1e2d; --navy2:#1a3448; --gold:#c4962a; --gold2:#e8c04a;
      --cream:#f8f5ee; --white:#fff; --text:#1a2535; --textmd:#4a5a70;
      --border:#dee4ef; --even:#f4f7fc; --hi:#fef8e6;
    }
    body{font-family:'Tajawal',Arial,sans-serif;background:var(--cream);color:var(--text);direction:rtl;font-size:14px}

    /* HEADER */
    .site-header{background:linear-gradient(155deg,#0a1a27 0%,#1a3448 100%);color:#fff;padding:20px 28px 16px;text-align:center;position:relative;overflow:hidden;border-bottom:3px solid var(--gold)}
    .site-header::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(196,150,42,.04) 0px,rgba(196,150,42,.04) 1px,transparent 1px,transparent 40px)}
    .site-header>div{position:relative;z-index:1}
    .hdr-org{font-size:12px;font-weight:300;color:rgba(255,255,255,.65);margin-bottom:3px}
    .hdr-col{font-size:14px;font-weight:500;color:var(--gold2);margin-bottom:7px}
    .hdr-title{font-size:17px;font-weight:700;line-height:1.55}

    /* CONTROLS */
    .ctrl-bar{background:#fff;padding:12px 20px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.07);position:sticky;top:0;z-index:300}
    .cg{display:flex;flex-direction:column;gap:5px}
    .clabel{font-size:11px;font-weight:700;color:var(--textmd);text-transform:uppercase;letter-spacing:.5px}
    .name-wrap{position:relative;width:250px}
    .name-inp{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:8px 36px 8px 12px;font-family:'Tajawal',sans-serif;font-size:13.5px;color:var(--text);background:var(--even);outline:none;transition:border-color .2s,box-shadow .2s}
    .name-inp:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(196,150,42,.1)}
    .name-clear{position:absolute;left:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--textmd);font-size:15px;line-height:1;display:none;user-select:none}
    .name-clear:hover{color:var(--navy)}
    .ac-drop{position:absolute;top:calc(100% + 4px);right:0;left:0;background:#fff;border:1.5px solid var(--gold);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.13);z-index:600;max-height:230px;overflow-y:auto;display:none}
    .ac-item{padding:9px 13px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0f0f0;transition:background .12s}
    .ac-item:last-child{border-bottom:none}
    .ac-item:hover,.ac-item.ac-sel{background:var(--hi)}
    .ac-item mark{background:none;color:var(--gold);font-weight:700}
    .ac-num{color:var(--textmd);font-size:11px;margin-left:5px}
    .dg{flex:1;min-width:300px}
    .date-btns{display:flex;gap:5px;flex-wrap:wrap}
    .dbtn{border:1.5px solid var(--border);border-radius:6px;padding:5px 10px;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:500;cursor:pointer;color:var(--textmd);background:var(--even);line-height:1.45;text-align:center;transition:all .17s}
    .dbtn:hover{border-color:var(--gold);color:var(--text);background:#fff}
    .dbtn.d-active{background:var(--navy);border-color:var(--navy);color:var(--gold2);font-weight:700}
    .dbtn.d-all{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
    .actions{display:flex;align-items:flex-end;gap:8px}
    .abtn{padding:8px 15px;border-radius:7px;font-family:'Tajawal',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;border:none;display:flex;align-items:center;gap:5px;transition:all .17s;white-space:nowrap}
    .abtn-print{background:var(--navy);color:#fff}
    .abtn-print:hover{background:var(--navy2)}
    .abtn-img{background:var(--gold);color:var(--navy)}
    .abtn-img:hover{background:var(--gold2)}
    .abtn-img:disabled{opacity:.6;cursor:not-allowed}
    .res-bar{padding:5px 20px 2px;font-size:12px;color:var(--textmd);min-height:20px}

    /* TABLE */
    .tbl-wrap{padding:12px 14px 28px;overflow-x:auto}
    table.mt{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 3px 20px rgba(0,0,0,.1);min-width:960px;font-size:13px}
    .mt thead tr:first-child th{background:var(--navy);color:#fff;padding:10px 6px 8px;text-align:center;font-size:11px;font-weight:600;border:1px solid rgba(255,255,255,.08);transition:background .2s}
    .mt thead tr:first-child th.hf{background:#091525;font-size:12px}
    .mt thead tr:first-child th.col-act{background:#a07a10!important;color:#fff!important}
    .mt thead tr:nth-child(2) th{background:var(--navy2);color:var(--gold2);padding:5px 6px;text-align:center;font-size:11px;font-weight:500;border:1px solid rgba(255,255,255,.06);transition:background .2s,color .2s}
    .mt thead tr:nth-child(2) th.col-act{background:var(--gold)!important;color:var(--navy)!important;font-weight:700}
    .mt tbody tr{border-bottom:1px solid var(--border);transition:background .12s}
    .mt tbody tr:nth-child(even){background:var(--even)}
    .mt tbody tr:hover{background:#ebf2fc}
    .mt tbody tr.tr-hide{display:none}
    .mt tbody tr.tr-hi{background:var(--hi)!important}
    .mt td{padding:9px 6px;text-align:center;border-left:1px solid var(--border)}
    td.td-id{font-weight:700;color:var(--textmd);font-size:12px;width:34px}
    td.td-name{text-align:right;padding-right:14px;font-size:13px;font-weight:500;min-width:168px}
    td.td-room{font-size:14px;font-weight:600;color:var(--navy2);min-width:50px;position:relative;transition:background .15s}
    td.td-room.empty{color:#bfc5d0;font-size:12px;font-weight:400}
    td.td-room.ca{background:rgba(196,150,42,.12)}
    td.td-room.ca::after{content:'';position:absolute;inset:2px;border:1.5px solid rgba(196,150,42,.5);border-radius:3px}
    td.td-tot{background:#e4edf8;font-weight:700;color:var(--navy);font-size:13px;min-width:42px}
    .mt tfoot td{background:var(--navy)!important;color:var(--gold2);font-weight:700;border-color:rgba(255,255,255,.08)!important;padding:10px 6px}
    .mt tfoot td.td-name{color:rgba(255,255,255,.65);font-size:12px;font-weight:500}
    .mt tfoot td.td-tot{background:#091525!important;color:var(--gold)!important;font-size:14px}

    @media print{
      .ctrl-bar,.res-bar,.actions{display:none!important}
      .tbl-wrap{padding:0;overflow:visible}
      .site-header{position:static!important}
      body{background:#fff}
      .mt{box-shadow:none;border-radius:0;min-width:auto}
      *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
      @page{size:landscape;margin:6mm}
    }
  </style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="hdr-org">المؤسسة العامة للتدريب التقني والمهني</div>
  <div class="hdr-col">الكلية التقنية بأبها &nbsp;•&nbsp; قسم تقنية الأعمال</div>
  <div class="hdr-title">جدول المراقبات للاختبارات النهائية — الفصل التدريبي الثاني 1447هـ</div>
</header>

<div class="ctrl-bar" id="ctrlBar">
  <div class="cg">
    <div class="clabel">🔍 البحث بالاسم</div>
    <div class="name-wrap">
      <input type="text" class="name-inp" id="nameInp" placeholder="اكتب حرفاً أو اسم المدرب…" autocomplete="off">
      <span class="name-clear" id="nameClear" title="مسح">✕</span>
      <div class="ac-drop" id="acDrop"></div>
    </div>
  </div>
  <div class="cg dg">
    <div class="clabel">📅 التصفية بالتاريخ</div>
    <div class="date-btns" id="dateBtns">
      <button class="dbtn d-all" data-di="-1">الكل</button>
    </div>
  </div>
  <div class="actions">
    <button class="abtn abtn-print" onclick="window.print()">🖨 طباعة</button>
    <button class="abtn abtn-img" id="imgBtn">📸 حفظ صورة</button>
  </div>
</div>
<div class="res-bar" id="resBar"></div>

<div class="tbl-wrap">
  <table class="mt" id="mainTbl">
    <thead>
      <tr id="hdr1">
        <th class="hf" rowspan="2">م</th>
        <th class="hf" rowspan="2" style="text-align:right;padding-right:14px;min-width:168px">اسم المدرب</th>
        <!-- injected -->
        <th class="hf" rowspan="2" style="min-width:42px">المجموع</th>
      </tr>
      <tr id="hdr2"><!-- injected --></tr>
    </thead>
    <tbody id="tBody"></tbody>
    <tfoot id="tFoot"></tfoot>
  </table>
</div>

<script>
/* ── DATA ─────────────────────────────────────────────────────── */

// 7 dates, 4 of them have 2 periods (الأولى+الثانية)
// Each date entry has: day, date, cols[] = indices into trainer.r[] array
const DATES = [
  {day:'الأحد',    dd:'21/12/1447', cols:[0,1],  periods:['الأولى','الثانية']},
  {day:'الإثنين', dd:'22/12/1447', cols:[2],    periods:['الأولى']},
  {day:'الثلاثاء',dd:'23/12/1447', cols:[3],    periods:['الأولى']},
  {day:'الأربعاء',dd:'24/12/1447', cols:[4,5],  periods:['الأولى','الثانية']},
  {day:'الخميس',  dd:'25/12/1447', cols:[6,7],  periods:['الأولى','الثانية']},
  {day:'الأحد',   dd:'28/12/1447', cols:[8,9],  periods:['الأولى','الثانية']},
  {day:'الإثنين', dd:'29/12/1447', cols:[10],   periods:['الأولى']},
];

// 11 room columns per trainer (indices 0-10), mapped to date-periods above
const TRAINERS = [
  {id:1,  name:'تركي أحمد عسيري',            r:['306','','301','','301','','','','308','301','302']},
  {id:2,  name:'خالد مداوي القحطاني',         r:['301','','308','','302','','','','311','306','304']},
  {id:3,  name:'سعيد عبدالرحمن الشهري',      r:['305','','','304','','','303','','311','302','304']},
  {id:4,  name:'علي محمد آل موسى',            r:['302','304','302','','304','','','','310','309','']},
  {id:5,  name:'عبدالله سعد العسيري',         r:['308','','302','','303','','','','310','303','305']},
  {id:6,  name:'محمد جبران آل سفران',         r:['303','','303','','304','','301','','301','','']},
  {id:7,  name:'خالد عبدالله السرحاني',       r:['311','','303','','','301','','301','309','310','']},
  {id:8,  name:'عضوان سعيد الأحمري',          r:['304','304','304','','305','','','','308','304','']},
  {id:9,  name:'إبراهيم سعيد الشهراني',      r:['309','','','302','','','302','','305','310','305']},
  {id:10, name:'محمد علي عسيري',              r:['301','303','','304','','','302','','306','311','']},
  {id:11, name:'عبدالعزيز عبدالله حرمل',     r:['306','','304','309','','','301','','306','311','']},
  {id:12, name:'ظافر سعيد آل صنيج',          r:['302','','305','','302','','','','305','312','']},
  {id:13, name:'علي محمد عسيري',              r:['308','302','','308','','','303','','304','301','']},
  {id:14, name:'حسن مانع آل عمير',           r:['305','306','','308','303','','','','304','','302']},
  {id:15, name:'ناصر علي آل مانع',           r:['309','','','306','','','304','','303','','301']},
  {id:16, name:'ظافر عبدالله الشهري',        r:['303','306','','301','','','304','','303','312','']},
  {id:17, name:'الحسين سالم آل عثمان',       r:['310','305','','305','','','305','','','303','']},
  {id:18, name:'حسن أحمد السيد',             r:['','','306','305','','301','305','302','','','303']},
  {id:19, name:'عبدالرحمن عبدالله الرعيني',  r:['304','','306','303','305','','','','302','308','']},
  {id:20, name:'كليب أحمد الزهراني',         r:['311','305','301','','301','','','','302','302','']},
  {id:21, name:'عبدالله صالح آل قبيل',       r:['312','302','','303','','','306','','309','308','']},
  {id:22, name:'عبدالرحمن سعيد آل حمحوم',   r:['312','301','','302','','','306','','','304','']},
  {id:23, name:'عبدالسلام مسفر القحطاني',    r:['313','303','308','','','302','','','','305','']},
  {id:24, name:'عبدالله يحيى آل فائع',       r:['310','','','309','','','','302','','305','303']},
  {id:25, name:'يحيى محمد عسيري',             r:['313','','','306','','','','301','301','306','301']},
  {id:26, name:'عبدالعزيز هادي القحطاني',    r:['','301','305','301','','302','','','','309','']},
];

/* ── STATE ────────────────────────────────────────────────────── */
let activeDi = -1; // active date index (-1 = all)
let nameQ    = '';

/* ── BUILD HEADERS ────────────────────────────────────────────── */
(function(){
  const r1   = document.getElementById('hdr1');
  const r2   = document.getElementById('hdr2');
  const btns = document.getElementById('dateBtns');
  const last = r1.lastElementChild;

  DATES.forEach((d, di) => {
    const span = d.cols.length;

    // Row 1: date name (colspan if 2 periods)
    const t1 = document.createElement('th');
    t1.id = `h1d${di}`;
    if (span > 1) t1.colSpan = span;
    t1.innerHTML = `${d.day}<br><span style="color:var(--gold2);font-size:10.5px;font-weight:400">${d.dd}</span>`;
    r1.insertBefore(t1, last);

    // Row 2: period labels
    d.periods.forEach((p, pi) => {
      const t2 = document.createElement('th');
      t2.id = `h2c${d.cols[pi]}`;
      t2.textContent = p;
      r2.appendChild(t2);
    });

    // Date filter button
    const btn = document.createElement('button');
    btn.className = 'dbtn';
    btn.dataset.di = di;
    btn.innerHTML = `${d.day}<br><small style="font-size:10px;opacity:.8">${d.dd}</small>`;
    btn.addEventListener('click', () => setDate(di));
    btns.appendChild(btn);
  });

  document.querySelector('[data-di="-1"]').addEventListener('click', () => setDate(-1));
})();

/* ── BUILD ROWS ───────────────────────────────────────────────── */
(function(){
  const tbody = document.getElementById('tBody');
  TRAINERS.forEach(t => {
    const tr = document.createElement('tr');
    tr.id = `tr_${t.id}`;
    tr.dataset.name = t.name;
    const total = t.r.filter(v => v !== '').length;

    let html = `<td class="td-id">${t.id}</td>`;
    html += `<td class="td-name"><span class="nm">${esc(t.name)}</span></td>`;
    t.r.forEach((rm, ci) => {
      const emp = rm === '';
      html += `<td class="td-room${emp?' empty':''}" data-ci="${ci}">${emp?'—':rm}</td>`;
    });
    html += `<td class="td-tot">${total}</td>`;
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
})();

/* ── BUILD FOOTER ─────────────────────────────────────────────── */
(function(){
  const tr = document.createElement('tr');
  // column totals
  const totals = Array.from({length:11}, (_,i) => TRAINERS.filter(t => t.r[i] !== '').length);
  let html = `<td class="td-id"></td><td class="td-name">مجموع اللجان</td>`;
  totals.forEach(c => html += `<td class="td-room">${c}</td>`);
  html += `<td class="td-tot">148</td>`;
  tr.innerHTML = html;
  document.getElementById('tFoot').appendChild(tr);
})();

/* ── DATE FILTER ──────────────────────────────────────────────── */
function setDate(di) {
  activeDi = di;
  const d = di >= 0 ? DATES[di] : null;

  // Buttons
  document.querySelectorAll('.dbtn').forEach(b => {
    const bdi = parseInt(b.dataset.di);
    b.classList.remove('d-active','d-all');
    if (bdi === di) b.classList.add(di === -1 ? 'd-all' : 'd-active');
  });

  // Header highlight
  DATES.forEach((dd, i) => {
    const on = i === di;
    const t1 = document.getElementById(`h1d${i}`);
    if (t1) t1.classList.toggle('col-act', on);
    dd.cols.forEach(ci => {
      const t2 = document.getElementById(`h2c${ci}`);
      if (t2) t2.classList.toggle('col-act', on);
    });
  });

  // Cell highlight
  document.querySelectorAll('[data-ci]').forEach(td => {
    const ci = +td.dataset.ci;
    const on = d ? d.cols.includes(ci) : false;
    td.classList.toggle('ca', on);
  });

  applyFilters();
}

/* ── FILTERS ──────────────────────────────────────────────────── */
function wordMatch(name, q) {
  if (!q) return true;
  if (name.startsWith(q)) return true;
  return name.split(' ').some(w =>
    w.startsWith(q) ||
    (w.startsWith('ال') && w.slice(2).startsWith(q)) ||
    (w.startsWith('آل') && w.slice(2).startsWith(q))
  );
}

function applyFilters() {
  const q = nameQ.trim();
  const d = activeDi >= 0 ? DATES[activeDi] : null;
  let shown = 0;

  TRAINERS.forEach(t => {
    const nmOk  = wordMatch(t.name, q);
    const dtOk  = !d || d.cols.some(ci => t.r[ci] !== '');
    const vis   = nmOk && dtOk;

    const tr = document.getElementById(`tr_${t.id}`);
    tr.classList.toggle('tr-hide', !vis);
    tr.classList.toggle('tr-hi',   vis && !!d);
    if (vis) shown++;

    // highlight match in name
    const span = tr.querySelector('.nm');
    if (span) {
      if (q && vis) {
        const idx = t.name.indexOf(q);
        if (idx >= 0) {
          span.innerHTML =
            esc(t.name.slice(0, idx)) +
            `<strong style="color:var(--navy);text-decoration:underline">${esc(t.name.slice(idx, idx+q.length))}</strong>` +
            esc(t.name.slice(idx+q.length));
        } else {
          span.textContent = t.name;
        }
      } else {
        span.textContent = t.name;
      }
    }
  });

  const bar = document.getElementById('resBar');
  if (q || activeDi >= 0) {
    const di = activeDi >= 0 ? ` — ${DATES[activeDi].day} ${DATES[activeDi].dd}` : '';
    bar.textContent = `عرض ${shown} مدرباً من أصل ${TRAINERS.length}${di}`;
  } else {
    bar.textContent = '';
  }
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── AUTOCOMPLETE ─────────────────────────────────────────────── */
(function(){
  const inp  = document.getElementById('nameInp');
  const drop = document.getElementById('acDrop');
  const clr  = document.getElementById('nameClear');
  let si = -1;

  function render(q) {
    if (!q) { drop.style.display='none'; return; }
    const hits = TRAINERS.filter(t => wordMatch(t.name, q)).slice(0, 10);
    if (!hits.length) { drop.style.display='none'; return; }
    drop.innerHTML = hits.map((t, i) => {
      const idx = t.name.indexOf(q);
      let dn = esc(t.name);
      if (idx >= 0)
        dn = esc(t.name.slice(0,idx)) +
             `<mark>${esc(t.name.slice(idx,idx+q.length))}</mark>` +
             esc(t.name.slice(idx+q.length));
      return `<div class="ac-item" data-n="${esc(t.name)}" data-i="${i}">
                <span class="ac-num">${t.id}.</span>${dn}</div>`;
    }).join('');
    drop.style.display='block'; si=-1;
    drop.querySelectorAll('.ac-item').forEach(el =>
      el.addEventListener('click', () => pick(el.dataset.n)));
  }

  function pick(name){
    inp.value=name; nameQ=name; clr.style.display='block';
    drop.style.display='none'; applyFilters();
  }

  inp.addEventListener('input', () => {
    nameQ = inp.value;
    clr.style.display = nameQ ? 'block' : 'none';
    render(nameQ.trim()); applyFilters();
  });
  clr.addEventListener('click', () => {
    inp.value=nameQ=''; clr.style.display='none';
    drop.style.display='none'; applyFilters();
  });
  inp.addEventListener('keydown', e => {
    const items = drop.querySelectorAll('.ac-item');
    if (!items.length) return;
    if (e.key==='ArrowDown'){e.preventDefault();si=Math.min(si+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('ac-sel',i===si))}
    else if (e.key==='ArrowUp'){e.preventDefault();si=Math.max(si-1,0);items.forEach((el,i)=>el.classList.toggle('ac-sel',i===si))}
    else if (e.key==='Enter'&&si>=0){e.preventDefault();pick(items[si].dataset.n)}
    else if (e.key==='Escape'){drop.style.display='none'}
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.name-wrap')) drop.style.display='none';
  });
})();

/* ── SAVE IMAGE ───────────────────────────────────────────────── */
document.getElementById('imgBtn').addEventListener('click', async () => {
  const btn=document.getElementById('imgBtn');
  const ctrl=document.getElementById('ctrlBar');
  const res=document.getElementById('resBar');
  btn.disabled=true; btn.textContent='⏳ جاري الحفظ…';
  ctrl.style.display='none'; res.style.display='none';
  window.scrollTo(0,0);
  await new Promise(r=>setTimeout(r,150));
  try {
    const canvas = await html2canvas(document.body,{
      scale:2, useCORS:true, backgroundColor:'#f8f5ee',
      scrollX:0, scrollY:0,
      windowWidth:document.body.scrollWidth,
      windowHeight:document.body.scrollHeight
    });
    const a=document.createElement('a');
    a.download='جدول-المراقبات-1447.png';
    a.href=canvas.toDataURL('image/png'); a.click();
  } catch {
    alert('تعذّر الحفظ. استخدم زر "طباعة" بدلاً من ذلك.');
  } finally {
    ctrl.style.display='flex'; res.style.display='block';
    btn.disabled=false; btn.innerHTML='📸 حفظ صورة';
  }
});
</script>
</body>
</html>

    <style>
        :root {
            --primary-color: #1a5c40;
            --secondary-color: #2563eb;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --border-color: #cbd5e1;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        /* الترويسة العلوية */
        .main-header {
            text-align: center;
            color: var(--primary-color);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .main-header h2 {
            margin: 5px 0;
            font-size: 22px;
        }
        .main-header h3 {
            margin: 5px 0;
            font-size: 18px;
            color: #475569;
        }

        .section {
            background: #fdfdfd;
            border: 1px solid #e0e6ed;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        
        .section h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
        }

        .input-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"], select {
            width: 60%;
            min-width: 250px;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            padding: 14px 28px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #12402c;
        }
        button:active {
            transform: scale(0.98);
        }

        /* تنسيق الجداول والنتائج */
        .result-container {
            padding: 15px;
            background: #fff;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 14px;
            text-align: center;
        }
        th {
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: bold;
        }
        tr:nth-child(even) {background-color: #f8fafc;}
        tr:hover {background-color: #e2e8f0;}
        
        .no-data {
            text-align: center;
            color: #dc2626;
            font-weight: bold;
            padding: 15px;
            background: #fef2f2;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }

        /* أزرار الأسماء المتشابهة */
        .choice-btn {
            background-color: var(--secondary-color);
            padding: 10px 20px;
            margin: 5px;
            font-size: 15px;
        }
        .choice-btn:hover {
            background-color: #1d4ed8;
        }

        /* أزرار الطباعة والتحميل */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }
        .btn-print { background-color: #475569; }
        .btn-print:hover { background-color: #334155; }
        .btn-download { background-color: #059669; }
        .btn-download:hover { background-color: #047857; }

        /* تنسيقات الطباعة */
        @media print {
            body { background: #fff; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .section { border: none; box-shadow: none; padding: 0; margin: 0; }
            .input-group, .action-buttons, p { display: none !important; }
            .hide-on-print { display: none !important; }
        }
    </style>
</head>

        const option = document.createElement('option');
        option.value = name;
        dataList.appendChild(option);

    // إنشاء أزرار الطباعة والتحميل
    function getActionButtonsHTML(targetSectionId) {
        return `
            <div class="action-buttons">
                <button class="btn-print" onclick="printSection('${targetSectionId}')">🖨️ طباعة الجدول</button>
                <button class="btn-download" onclick="downloadImage()">🖼️ تحميل كصورة</button>
            </div>
        `;
    }

    // إعداد الشاشة للطباعة (إخفاء الأقسام غير المطلوبة)
    function printSection(activeSectionId) {
        const sectionTeacher = document.getElementById('sectionTeacher');
        const sectionDay = document.getElementById('sectionDay');
        
        if(activeSectionId === 'sectionTeacher') {
            sectionDay.classList.add('hide-on-print');
            sectionTeacher.classList.remove('hide-on-print');
        } else {
            sectionTeacher.classList.add('hide-on-print');
            sectionDay.classList.remove('hide-on-print');
        }
        window.print();
    }

    // تحميل النتيجة كصورة
    function downloadImage() {
        const buttons = document.querySelectorAll('.action-buttons');
        buttons.forEach(btn => btn.style.display = 'none'); // إخفاء الأزرار مؤقتاً

        const captureArea = document.getElementById('captureArea');
        html2canvas(captureArea, {
            backgroundColor: '#ffffff',
            scale: 2
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'جدول_المراقبة.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            buttons.forEach(btn => btn.style.display = 'flex'); // إعادة عرض الأزرار
        });
    }

    // البحث ببيانات المدرب مع معالجة الأسماء المتشابهة
    function searchByTeacher(exactName = null) {
        const inputField = document.getElementById('teacherName');
        // إما أن يأخذ الاسم الممرر كمعامل (عند النقر على الأزرار) أو النص المكتوب
        const nameInput = exactName || inputField.value.trim();
        const resultDiv = document.getElementById('teacherResult');
        resultDiv.innerHTML = ''; 
        document.getElementById('dayResult').innerHTML = ''; // مسح نتائج القسم الآخر

        if (nameInput === "") {
            resultDiv.innerHTML = '<div class="no-data">يرجى إدخال اسم المدرب للبحث.</div>';
            return;
        }

        // إيجاد أسماء المدربين (كأسماء فريدة) التي تحتوي على نص البحث
        const matchedTeachersNames = [...new Set(scheduleData
            .filter(item => item.teacher.includes(nameInput))
            .map(item => item.teacher))];

        if (matchedTeachersNames.length === 0) {
            resultDiv.innerHTML = `<div class="no-data">لا توجد بيانات للمدرب المدخل. يرجى التأكد من الاسم.</div>`;
            return;
        }

        // إذا كان هناك أكثر من مدرب بنفس الاسم المكتوب (مثال: خالد)
        if (matchedTeachersNames.length > 1) {
            let choiceHTML = `
                <div style="background:#f8fafc; padding:20px; border-radius:8px; border:1px solid var(--border-color); text-align:center;">
                    <h3 style="color:var(--primary-color); margin-top:0;">يوجد عدة مدربين بهذا الاسم، الرجاء اختيار المدرب المطلوب:</h3>
                    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:15px;">
            `;
            matchedTeachersNames.forEach(tName => {
                choiceHTML += `<button class="choice-btn" onclick="document.getElementById('teacherName').value='${tName}'; searchByTeacher('${tName}')">${tName}</button>`;
            });
            choiceHTML += `</div></div>`;
            resultDiv.innerHTML = choiceHTML;
            return;
        }

        // إذا كان هناك مدرب واحد فقط يطابق البحث
        const selectedTeacher = matchedTeachersNames[0];
        const results = scheduleData.filter(item => item.teacher === selectedTeacher);

        let tableHTML = `
            <h3 style="text-align:center; color:#1a5c40;">جدول المدرب: ${selectedTeacher}</h3>
            <table>
                <tr>
                    <th>اليوم والتاريخ</th>
                    <th>الفترة</th>
                    <th>القاعة</th>
                </tr>
        `;
        results.forEach(item => {
            tableHTML += `
                <tr>
                    <td>${item.date}</td>
                    <td>${item.period}</td>
                    <td>${item.room}</td>
                </tr>
            `;
        });
        tableHTML += `</table>`;
        tableHTML += getActionButtonsHTML('sectionTeacher');
        resultDiv.innerHTML = tableHTML;
    }

    // البحث حسب اليوم
    function searchByDay() {
        const daySelected = document.getElementById('daySelect').value;
        const resultDiv = document.getElementById('dayResult');
        resultDiv.innerHTML = ''; 
        document.getElementById('teacherResult').innerHTML = ''; // مسح نتائج القسم الآخر

        const results = scheduleData.filter(item => item.date === daySelected);

        if (results.length > 0) {
            let tableHTML = `
                <h3 style="text-align:center; color:#1a5c40;">مراقبي يوم: ${daySelected}</h3>
                <table>
                    <tr>
                        <th>اسم المدرب</th>
                        <th>الفترة</th>
                        <th>القاعة</th>
                    </tr>
            `;
            results.forEach(item => {
                tableHTML += `
                    <tr>
                        <td>${item.teacher}</td>
                        <td>${item.period}</td>
                        <td>${item.room}</td>
                    </tr>
                `;
            });
            tableHTML += `</table>`;
            tableHTML += getActionButtonsHTML('sectionDay');
            resultDiv.innerHTML = tableHTML;
        } else {
            resultDiv.innerHTML = `<div class="no-data">عذراً، لا يوجد مدربون مكلفون بالمراقبة في هذا اليوم.</div>`;
        }
    }
